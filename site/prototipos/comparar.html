<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>ZHUBA · comparar portadas</title>
<style>
  /* Fondo gris neutro: ni claro ni oscuro, para no inclinar la comparación. */
  body { margin: 0; background: #8B8B8B; font-family: system-ui, sans-serif; }
  .fila { display: flex; gap: 24px; padding: 24px; align-items: flex-start; }
  .col p { margin: 0 0 10px; font-size: 22px; font-weight: 600; color: #111; }
  .marco { overflow: hidden; }
  iframe { border: 0; display: block; transform-origin: 0 0; }
</style>
</head>
<body>
<div class="fila" id="fila"></div>
<script>
  /* ?w= ancho que ve cada portada, ?h= su alto, ?s= escala del marco. */
  var q = new URLSearchParams(location.search);
  var w = +q.get('w') || 1440, h = +q.get('h') || 4246, s = +q.get('s') || 0.5;
  ['claro', 'oscuro'].forEach(function (t) {
    var col = document.createElement('div');
    col.className = 'col';
    col.innerHTML = '<p>' + (t === 'claro' ? 'Claro' : 'Oscuro') + '</p>' +
      '<div class="marco" style="width:' + (w * s) + 'px;height:' + (h * s) + 'px">' +
      '<iframe src="portada.html?tema=' + t + '" style="width:' + w + 'px;height:' + h +
      'px;transform:scale(' + s + ')"></iframe></div>';
    document.getElementById('fila').appendChild(col);
  });
</script>
</body>
</html>
